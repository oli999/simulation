<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>네트워크 시뮬레이터</title>
    <style>
        /* 전체 배경과 중앙 정렬 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #f8f9fa; /* 아주 옅은 회색 배경 */
            display: flex; 
            justify-content: center; 
            padding: 50px 20px;
        }

        /* 메인 컨텐츠를 담는 깔끔한 흰색 박스 */
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); /* 은은한 그림자 */
            max-width: 650px;
            width: 100%;
        }

        /* 대제목 스타일 */
        h1 { 
            margin-top: 0; 
            color: #2c3e50; 
            font-size: 24px; 
            border-bottom: 2px solid #ecf0f1; /* 제목 아래 실선 */
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        }

        /* 리스트 기본 속성 제거 및 깔끔한 행(Row) 디자인 */
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        li { 
            margin-bottom: 10px; 
            padding: 15px 20px; 
            border-radius: 8px; 
            transition: all 0.2s; 
            border: 1px solid transparent;
        }
        /* 마우스 올렸을 때 살짝 하이라이트 */
        li:hover { 
            background: #f8f9fa; 
            border-color: #e9ecef; 
        }

        /* 링크(제목) 스타일 */
        a { 
            text-decoration: none; 
            font-size: 18px; 
            font-weight: bold; 
            color: #007bff; 
            display: block; 
            margin-bottom: 6px; 
        }
        a:hover { 
            color: #0056b3; 
            text-decoration: underline; 
        }

        /* 부가 설명 스타일 */
        .desc { 
            color: #6c757d; 
            font-size: 14.5px; 
            line-height: 1.5; 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>여러가지 시뮬레이터</h1>
        
        <ul>
            <li>
                <a href="cloudflared.html">▶ Cloudflare Tunnels</a> 
                <span class="desc">공유기 방화벽을 우회하는 역방향 터널(Outbound)의 통신 원리</span>
            </li>
            <li>
                <a href="talescale.html">▶ Tailscale Subnet</a> 
                <span class="desc">AWS VPC와 온프레미스(VMware)를 연결하는 Site-to-Site 하이브리드 라우팅</span>
            </li>
        </ul>
    </div>

</body>
</html>
